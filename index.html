<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artistic Splat Viewer - Psychedelic Liquid Trip</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: 'Courier New', monospace;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #fff;
      z-index: 10;
      gap: 1rem;
      transition: opacity 0.8s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading p {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ff00ff;
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
    }
    .bar { width: 180px; height: 1px; background: #222; }
    .fill { height: 100%; background: #00ffff; width: 0%; transition: width 0.2s; box-shadow: 0 0 10px #00ffff;}

    #controls {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      z-index: 5;
      opacity: 0;
      background: rgba(0, 0, 0, 0.75);
      padding: 1.5rem;
      border: 1px solid #ff00ff;
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.3), inset 0 0 15px rgba(0, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      transition: opacity 0.5s ease;
    }
    #controls.visible { opacity: 1; }

    .ctrl {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .ctrl-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .ctrl label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: bold;
      color: #00ffff;
    }

    .ctrl-value {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: #fff;
      min-width: 3.5rem;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 180px;
      height: 4px;
      background: #222;
      outline: none;
      cursor: pointer;
      border: 1px solid #444;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #ff00ff;
      box-shadow: 0 0 8px #00ffff;
      cursor: pointer;
    }

    #btn-toggle-scene {
      background: transparent;
      border: 1px solid #00ffff;
      color: #00ffff;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      margin-top: 0.5rem;
    }
    #btn-toggle-scene:hover {
      background: #00ffff;
      color: #000;
      box-shadow: 0 0 15px #00ffff;
    }

    #hint {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: #555;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="loading">
    <p id="loading-text">A dilatar pupilas gráficas...</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div id="controls">
    <div class="ctrl">
      <div class="ctrl-header">
        <label>Frequência (BPM)</label>
        <span class="ctrl-value" id="val-speed">1.0x</span>
      </div>
      <input type="range" id="slider-speed" min="0.0" max="4.0" step="0.1" value="1.0">
    </div>

    <div class="ctrl">
      <div class="ctrl-header">
        <label>Derretimento Líquido</label>
        <span class="ctrl-value" id="val-warp">20%</span>
      </div>
      <input type="range" id="slider-warp" min="0.0" max="0.1" step="0.005" value="0.02">
    </div>

    <div class="ctrl">
      <div class="ctrl-header">
        <label>Chroma Shift</label>
        <span class="ctrl-value" id="val-split">15%</span>
      </div>
      <input type="range" id="slider-split" min="0.0" max="0.04" step="0.002" value="0.015">
    </div>
    
    <button id="btn-toggle-scene">Mudar Cena</button>
  </div>

  <p id="hint">Arrastar · Scroll para zoom · Botão direito para mover</p>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- COMPOSER DE PÓS-PROCESSAMENTO ---
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    // Shader Psicadélico Estável (Fórmulas Matemáticas de Espectro Contínuo)
    const PsychedelicShader = {
      uniforms: {
        "tDiffuse": { value: null },
        "time": { value: 0.0 },
        "warp": { value: 0.02 },
        "chroma": { value: 0.015 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float warp;
        uniform float chroma;
        varying vec2 vUv;

        // Gerador Cosine Palette de Inigo Quilez (Espectro Puro e Fluido)
        vec3 rainbowPalette(in float t) {
          vec3 a = vec3(0.5, 0.5, 0.5);
          vec3 b = vec3(0.5, 0.5, 0.5);
          vec3 c = vec3(1.0, 1.0, 1.0);
          vec3 d = vec3(0.0, 0.33, 0.67);
          return a + b * cos(6.28318 * (c * t + d));
        }

        void main() {
          vec2 uv = vUv;

          // Ondas de Distorção Espacial Líquida
          float waveX = sin(uv.y * 12.0 + time * 1.5) * warp;
          float waveY = cos(uv.x * 12.0 + time * 1.2) * warp;
          uv.x += waveX;
          uv.y += waveY;

          // Separação de Canais Cromáticos (Aberração)
          float rChan = texture2D(tDiffuse, uv + vec2(chroma, 0.0)).r;
          float gChan = texture2D(tDiffuse, uv).g;
          float bChan = texture2D(tDiffuse, uv - vec2(chroma, 0.0)).b;
          float alpha = texture2D(tDiffuse, uv).a;
          
          vec3 baseColor = vec3(rChan, gChan, bChan);

          // Cálculo de Luminância e Injeção de Plasma
          float luma = dot(baseColor, vec3(0.299, 0.587, 0.114));
          
          // Padrão de interferência psicadélica baseado no espaço modificado
          float pattern = sin(uv.x * 4.0 + time * 0.5) * cos(uv.y * 4.0 - time * 0.3);
          vec3 rainbow = rainbowPalette(luma * 0.8 + pattern * 0.5 + time * 0.15);

          // Mistura o mundo real do Splat com as cores alucinogénicas nas áreas iluminadas
          vec3 finalColor = mix(baseColor, rainbow, luma * 0.7);

          gl_FragColor = vec4(finalColor, alpha);
        }
      `
    };

    const psychPass = new ShaderPass(PsychedelicShader);
    composer.addPass(psychPass);

    const scenes = ["content/scene.spz", "content/scene1.spz", "content/scene2.spz"];
    let currentSceneIndex = 0;
    let splat = null;
    let clock = new THREE.Clock();
    let customTime = 0;
    let speedMultiplier = 1.0;

    // Interface
    const sliderSpeed = document.getElementById("slider-speed");
    const sliderWarp = document.getElementById("slider-warp");
    const sliderSplit = document.getElementById("slider-split");
    
    const valSpeed = document.getElementById("val-speed");
    const valWarp = document.getElementById("val-warp");
    const valSplit = document.getElementById("val-split");

    function loadScene(url) {
      if (splat) {
        scene.remove(splat);
        splat = null;
      }

      const loadingEl = document.getElementById("loading");
      const fillEl = document.getElementById("fill");
      fillEl.style.width = "0%";
      loadingEl.classList.remove("hidden");

      const filename = url.substring(url.lastIndexOf('/') + 1);
      document.getElementById("btn-toggle-scene").textContent = `Mudar Cena: ${filename}`;

      splat = new SplatMesh({
        url: url,
        onProgress: (e) => {
          if (e.total) {
            fillEl.style.width = (e.loaded / e.total * 100) + "%";
          }
        },
        onLoad: () => {
          loadingEl.classList.add("hidden");
          document.getElementById("controls").classList.add("visible");
        }
      });

      if(splat.recolor) splat.recolor.setHex(0xffffff);
      scene.add(splat);
    }

    // Eventos dos Sliders
    sliderSpeed.addEventListener("input", () => {
      speedMultiplier = parseFloat(sliderSpeed.value);
      valSpeed.textContent = speedMultiplier.toFixed(1) + "x";
    });

    sliderWarp.addEventListener("input", () => {
      const w = parseFloat(sliderWarp.value);
      psychPass.uniforms.warp.value = w;
      valWarp.textContent = Math.round(w * 1000) / 10 + "%";
    });

    sliderSplit.addEventListener("input", () => {
      const s = parseFloat(sliderSplit.value);
      psychPass.uniforms.chroma.value = s;
      valSplit.textContent = Math.round(s * 1000) / 10 + "%";
    });

    document.getElementById("btn-toggle-scene").addEventListener("click", () => {
      currentSceneIndex = (currentSceneIndex + 1) % scenes.length;
      loadScene(scenes[currentSceneIndex]);
    });

    // Loop de Animação
    renderer.setAnimationLoop(() => {
      const delta = clock.getDelta();
      customTime += delta * speedMultiplier;
      
      // Passa o tempo incremental para o shader animar os senos e cossenos
      psychPass.uniforms.time.value = customTime;

      controls.update();
      composer.render(); 
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });

    loadScene(scenes[currentSceneIndex]);
  </script>

</body>
</html>
