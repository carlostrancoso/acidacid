<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene Viewer</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: 'Courier New', monospace;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      z-index: 10;
      gap: 1rem;
      transition: opacity 0.8s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading p {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
    }
    .bar { width: 180px; height: 1px; background: #222; }
    .fill { height: 100%; background: #fff; width: 0%; transition: width 0.2s; }

    /* Painel de controlos */
    #controls {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #controls.visible { opacity: 1; }

    .ctrl {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .ctrl-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .ctrl label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #555;
    }

    .ctrl-value {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: #888;
      min-width: 2.5rem;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 140px;
      height: 1px;
      background: #333;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      transition: transform 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.4);
    }

    #hint {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: #2a2a2a;
      text-transform: uppercase;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="loading">
    <p>A carregar cena</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div id="controls">
    <div class="ctrl">
      <div class="ctrl-header">
        <label>Escala</label>
        <span class="ctrl-value" id="val-scale">1.00</span>
      </div>
      <input type="range" id="slider-scale" min="0.1" max="3" step="0.01" value="1">
    </div>
    <div class="ctrl">
      <div class="ctrl-header">
        <label>Opacidade</label>
        <span class="ctrl-value" id="val-opacity">1.00</span>
      </div>
      <input type="range" id="slider-opacity" min="0" max="1" step="0.01" value="1">
    </div>
  </div>

  <p id="hint">Arrastar · Scroll para zoom · Botão direito para mover</p>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const splat = new SplatMesh({
      url: "content/scene.spz",
      onProgress: (e) => {
        if (e.total) {
          document.getElementById("fill").style.width = (e.loaded / e.total * 100) + "%";
        }
      },
      onLoad: () => {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("controls").classList.add("visible");
      }
    });
    scene.add(splat);

    // --- Sliders ---
    const sliderScale   = document.getElementById("slider-scale");
    const sliderOpacity = document.getElementById("slider-opacity");
    const valScale      = document.getElementById("val-scale");
    const valOpacity    = document.getElementById("val-opacity");

    sliderScale.addEventListener("input", () => {
      const v = parseFloat(sliderScale.value);
      splat.scale.setScalar(v);
      valScale.textContent = v.toFixed(2);
    });

    sliderOpacity.addEventListener("input", () => {
      const v = parseFloat(sliderOpacity.value);
      splat.opacity = v;
      valOpacity.textContent = v.toFixed(2);
    });

    // --- Loop ---
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>

</body>
</html>
