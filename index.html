<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artistic Splat Viewer - Hue Spectrum</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: 'Courier New', monospace;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      z-index: 10;
      gap: 1rem;
      transition: opacity 0.8s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading p {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
    }
    .bar { width: 180px; height: 1px; background: #222; }
    .fill { height: 100%; background: #fff; width: 0%; transition: width 0.2s; }

    #controls {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      z-index: 5;
      opacity: 0;
      background: rgba(0, 0, 0, 0.9);
      padding: 1.5rem;
      border: 1px solid #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 210, 0.15);
      transition: opacity 0.5s ease;
    }
    #controls.visible { opacity: 1; }

    .ctrl {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .ctrl-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .ctrl label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #00ffcc;
      font-weight: bold;
    }

    .ctrl-value {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: #fff;
      min-width: 4.5rem;
      text-align: right;
    }

    /* Slider com Spectrum em Gradient para Feedback Visual */
    input[type="range"] {
      -webkit-appearance: none;
      width: 200px;
      height: 8px;
      background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      outline: none;
      cursor: pointer;
      border: 1px solid #333;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 18px;
      background: #fff;
      border: 1px solid #000;
      cursor: pointer;
    }

    #btn-toggle-scene {
      background: #00ffcc;
      border: 1px solid #00ffcc;
      color: #000;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      margin-top: 0.5rem;
    }
    #btn-toggle-scene:hover {
      background: #000;
      color: #00ffcc;
    }

    #hint {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: #444;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="loading">
    <p id="loading-text">A carregar matriz de cor</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div id="controls">
    <!-- Slider Único: Espetro Cromático Contínuo de 0 a 360 Graus -->
    <div class="ctrl">
      <div class="ctrl-header">
        <label>Tom Espetral</label>
        <span class="ctrl-value" id="val-hue">Original</span>
      </div>
      <input type="range" id="slider-hue" min="0" max="360" step="1" value="0">
    </div>
    
    <button id="btn-toggle-scene">Mudar Cena</button>
  </div>

  <p id="hint">Arrastar · Scroll para zoom · Botão direito para mover</p>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const scenes = ["content/scene.spz", "content/scene1.spz", "content/scene2.spz"];
    let currentSceneIndex = 0;
    let splat = null;

    // Instanciamos um objeto Color utilitário do Three.js para fazer as conversões HSL nativas
    const targetColor = new THREE.Color();

    const sliderHue = document.getElementById("slider-hue");
    const valHue    = document.getElementById("val-hue");

    function loadScene(url) {
      if (splat) {
        scene.remove(splat);
        splat = null;
      }

      const loadingEl = document.getElementById("loading");
      const fillEl = document.getElementById("fill");
      fillEl.style.width = "0%";
      loadingEl.classList.remove("hidden");

      const filename = url.substring(url.lastIndexOf('/') + 1);
      document.getElementById("btn-toggle-scene").textContent = `Mudar Cena: ${filename}`;

      splat = new SplatMesh({
        url: url,
        onProgress: (e) => {
          if (e.total) {
            fillEl.style.width = (e.loaded / e.total * 100) + "%";
          }
        },
        onLoad: () => {
          loadingEl.classList.add("hidden");
          document.getElementById("controls").classList.add("visible");
          applySpectrumHue();
        }
      });

      scene.add(splat);
    }

    // Função matemática fluida que converte os graus do slider num tom HSL real
    function applySpectrumHue() {
      if (!splat) return;

      const hueVal = parseInt(sliderHue.value);

      if (hueVal === 0 || hueVal === 360) {
        // Nas extremidades, restauramos a paleta original do SPZ
        if (splat.recolor) {
          splat.recolor.setHex(0xffffff);
        }
        valHue.textContent = "Original";
      } else {
        // Converte o valor de 0-360 para um rácio de 0.0 a 1.0 exigido pelo Three.js
        const h = hueVal / 360;
        // Fixamos Saturação em 100% e Luminosidade a 50% para cores vivas e puras
        targetColor.setHSL(h, 1.0, 0.5);

        if (splat.recolor) {
          splat.recolor.copy(targetColor);
        }
        valHue.textContent = `${hueVal}°`;
      }
    }

    // Evento contínuo 'input' garante que muda de cor em tempo real enquanto arrastas o slider
    sliderHue.addEventListener("input", applySpectrumHue);

    document.getElementById("btn-toggle-scene").addEventListener("click", () => {
      currentSceneIndex = (currentSceneIndex + 1) % scenes.length;
      loadScene(scenes[currentSceneIndex]);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Inicialização direta e focada
    loadScene(scenes[currentSceneIndex]);
  </script>

</body>
</html>
